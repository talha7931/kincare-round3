name: kincare_android
description: KinCare caregiver and elderly profile client for Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  image_picker: ^1.1.2
  record: ^5.1.2
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.3
  shared_preferences: ^2.5.3
  uuid: ^4.4.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  record_platform_interface: 1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/cognitive_games.json
